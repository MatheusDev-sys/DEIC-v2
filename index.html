  <!-- Favicon e Ícones PWA -->

  <link rel="apple-touch-icon" href="./deic-icon-v3.png">

  <style>
    :root {
      --primary-blue: #0ea5e9;
      --dark-bg: #020617;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--dark-bg);
      color: #e2e8f0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Animation Utilities */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    /* Text Gradient Animation */
    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .deic-title-gradient {
      color: #c9e3ff;
      background: linear-gradient(105deg, #76a6df 5%, #c9e3ff 29%, #e3eaf3 53%, #dbc79b 72%, #8cb7e9 96%);
      background-size: 235% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMove 12s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .deic-title-gradient { animation: none; background-position: 45% 50%; }
    }

    /* Scroll Animations */
    @keyframes slideInFromLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideOutToLeft {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(-50px);
      }
    }


    .scroll-animate {
      opacity: 0;
      transform: translateX(-50px);
    }

    .scroll-animate.animate-down {
      animation: slideInFromLeft 0.6s ease-out forwards;
    }

    .scroll-animate.animate-up {
      animation: slideOutToLeft 0.6s ease-out forwards;
    }

    /* Stagger delays for cards */
    .scroll-animate:nth-child(1) {
      transition-delay: 0ms;
    }

    .scroll-animate:nth-child(2) {
      transition-delay: 100ms;
    }

    .scroll-animate:nth-child(3) {
      transition-delay: 200ms;
    }

    .scroll-animate:nth-child(4) {
      transition-delay: 300ms;
    }

    .scroll-animate.animate-down:nth-child(1) {
      animation-delay: 0ms;
    }

    .scroll-animate.animate-down:nth-child(2) {
      animation-delay: 100ms;
    }

    .scroll-animate.animate-down:nth-child(3) {
      animation-delay: 200ms;
    }

    .scroll-animate.animate-down:nth-child(4) {
      animation-delay: 300ms;
    }

    .scroll-animate.animate-up:nth-child(1) {
      animation-delay: 0ms;
    }

    .scroll-animate.animate-up:nth-child(2) {
      animation-delay: 100ms;
    }

    .scroll-animate.animate-up:nth-child(3) {
      animation-delay: 200ms;
    }

    .scroll-animate.animate-up:nth-child(4) {
      animation-delay: 300ms;
    }

    .scroll-animate.animate:nth-child(4) {
      animation-delay: 300ms;
    }
  </style>
